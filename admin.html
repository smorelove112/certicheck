<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Certicheck Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link rel="preconnect" href="https://certicheck-backend-8hu3.onrender.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styling.css"/>
</head>
<body>
  <nav id="navbar">
    <button class="nav-logo" onclick="window.location.href='index.html'" aria-label="Certicheck home">
      <svg width="34" height="34" viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="8" fill="url(#logoGrad)"/>
        <path d="M8 10L18 6L28 10L28 20L18 26L8 20L8 10Z" stroke="white" stroke-width="1.6" fill="none"/>
        <path d="M18 6L18 26M8 10L28 20M28 10L8 20" stroke="white" stroke-width="1" opacity="0.5"/>
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="36" y2="36">
            <stop offset="0%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#4f46e5"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="nav-brand">Certicheck Admin</span>
    </button>
    <div class="nav-actions">
      <button class="btn-ghost" onclick="window.location.href='index.html'">Main site</button>
      <div id="adminSignedInUser" class="admin-nav-user" style="display:none;align-items:center;gap:10px;margin-left:12px;position:relative">
        <button id="adminProfileToggle" class="btn-ghost" aria-label="Open admin profile menu. Click the avatar to manage its photo." aria-haspopup="menu" style="display:flex;align-items:center;gap:8px">
          <div class="admin-avatar" id="adminAvatarButton" aria-hidden="true" title="Click to add or manage your profile photo">AD</div>
          <div style="display:flex;flex-direction:column;text-align:left">
            <div style="font-size:13px;font-weight:700;color:var(--text-primary)" id="navAdminName">Admin</div>
            <div style="font-size:11px;color:var(--text-secondary)" id="navAdminEmail"></div>
          </div>
        </button>
        <input id="adminAvatarInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
        <div id="adminAvatarMenu" class="admin-avatar-menu" role="menu" style="display:none">
          <button id="adminAvatarView" class="btn-ghost" type="button" role="menuitem">View photo</button>
          <button id="adminAvatarChange" class="btn-ghost" type="button" role="menuitem">Change photo</button>
          <button id="adminAvatarRemove" class="btn-ghost" type="button" role="menuitem">Remove photo</button>
        </div>
        <div id="adminProfileMenu" style="position:absolute;right:0;top:44px;display:none;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px;min-width:220px;box-shadow:var(--shadow-sm);z-index:999">
          <div style="font-weight:700;margin-bottom:6px" id="menuName">Admin</div>
          <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px" id="menuEmail"></div>
          <button id="menuProfileSettings" class="btn-ghost" type="button" style="width:100%;text-align:left">Profile settings</button>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button id="menuSignOut" class="btn-ghost">Sign out</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <dialog id="adminAvatarDialog" class="admin-avatar-dialog" aria-labelledby="adminAvatarDialogTitle">
    <div class="admin-avatar-dialog-header">
      <h2 id="adminAvatarDialogTitle">Admin profile photo</h2>
      <button id="adminAvatarDialogClose" class="btn-ghost" type="button" aria-label="Close profile photo">×</button>
    </div>
    <img id="adminAvatarPreview" alt="Admin profile photo preview" />
    <button id="adminAvatarDialogChange" class="btn-outline" type="button">Change photo</button>
  </dialog>
  
  <div class="page-wrap" style="max-width:1440px; margin:100px auto 80px; padding:0 18px;">

    <header class="admin-header" style="margin-bottom:22px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div>
          <div class="eyebrow">Admin Portal</div>
          <h1 class="page-title" style="margin:6px 0 6px 0">Issuer Approval Console</h1>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <div id="adminSummary" style="color:var(--text-secondary);font-size:14px;text-align:right"></div>
        </div>
      </div>
    </header>

    <div id="adminLoginCard" class="form-card" style="max-width:560px;margin:26px auto 0;padding:28px;display:block;">
      <div id="adminLoginError" class="alert alert-danger" style="display:none;margin-bottom:16px;"></div>
      <form id="adminLoginForm" style="display:flex;flex-direction:column;gap:16px;">
        <div>
          <label for="adminEmail" style="display:block;margin-bottom:8px;font-weight:700;color:var(--text-primary);">Admin Email</label>
          <input id="adminEmail" type="email" name="email" placeholder="Admin email" style="width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-subtle);color:var(--text-primary);" required />
        </div>
        <div>
          <label for="adminPassword" style="display:block;margin-bottom:8px;font-weight:700;color:var(--text-primary);">Admin Password</label>
          <input id="adminPassword" type="password" name="password" placeholder="Enter admin password" style="width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-subtle);color:var(--text-primary);" required />
        </div>
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;">Sign In</button>
      </form>
      <button id="adminForgotPassword" class="btn-ghost" type="button" style="margin-top:10px">Forgot password?</button>
    </div>

    <section class="admin-stats" style="margin-bottom:18px;display:none;">
      <div id="adminStatsGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px"></div>
    </section>

    <div class="admin-main-grid" style="display:none">

      <main class="admin-primary">
        <div class="form-card admin-dashboard-card" id="adminDashboard" style="display:none;margin-top:14px;padding:18px">
          <div class="admin-overview-heading">
            <div class="page-tag">Overview</div>
          </div>

          <div id="adminList" style="margin-top:18px;"></div>
        </div>

      </main>

    </div>

    <!-- audit-activity section removed (audit view is inside the dashboard) -->

  <div id="adminDetailDrawer" style="position:fixed;right:20px;top:80px;width:min(420px, calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--bg-card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);padding:20px;display:none;z-index:1200;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;">
      <div style="font-size:18px;font-weight:800;color:var(--text-primary);">Application detail</div>
      <button id="adminDrawerClose" class="btn-ghost" type="button">Close</button>
    </div>
    <div id="adminDetailContent"></div>
  </div>

  <div id="adminToastStack" style="position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:1300;"></div>

  <dialog id="adminProfileSettingsDialog" style="width:min(460px,calc(100vw - 32px));border:1px solid var(--border);border-radius:16px;background:var(--bg-card);color:var(--text-primary);padding:24px">
    <form id="adminProfileSettingsForm" style="display:flex;flex-direction:column;gap:14px">
      <h2 style="margin:0">Admin profile settings</h2>
      <label>Display name<input id="adminProfileNameInput" maxlength="255" required style="display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-subtle);color:var(--text-primary)"></label>
      <div id="adminProfileSettingsError" role="alert" style="color:#b91c1c"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button id="adminProfileSettingsClose" class="btn-ghost" type="button">Close</button>
        <button class="btn-primary" type="submit">Save profile</button>
      </div>
    </form>
    <hr style="width:100%;border:0;border-top:1px solid var(--border);margin:18px 0">
    <form id="adminPasswordChangeForm" style="display:flex;flex-direction:column;gap:12px">
      <h3 style="margin:0">Change password</h3>
      <label>Current password<input id="adminCurrentPassword" type="password" autocomplete="current-password" required style="display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-subtle);color:var(--text-primary)"></label>
      <label>New password<input id="adminNewPassword" type="password" autocomplete="new-password" minlength="6" required style="display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-subtle);color:var(--text-primary)"></label>
      <button class="btn-outline" type="submit">Update password</button>
    </form>
  </dialog>

  <dialog id="adminForgotPasswordDialog" style="width:min(460px,calc(100vw - 32px));border:1px solid var(--border);border-radius:16px;background:var(--bg-card);color:var(--text-primary);padding:24px">
    <form id="adminForgotPasswordForm" style="display:flex;flex-direction:column;gap:14px">
      <h2 style="margin:0">Reset admin password</h2>
      <p style="margin:0;color:var(--text-secondary)">An OTP will be sent to the admin email address you enter.</p>
      <label>Admin email<input id="adminResetEmail" type="email" required style="display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-subtle);color:var(--text-primary)"></label>
      <button class="btn-outline" type="submit">Send reset code</button>
    </form>
    <form id="adminResetPasswordForm" style="display:flex;flex-direction:column;gap:12px;margin-top:14px">
      <label>OTP code<input id="adminResetOtp" inputmode="numeric" autocomplete="one-time-code" required style="display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-subtle);color:var(--text-primary)"></label>
      <label>New password<input id="adminResetNewPassword" type="password" minlength="6" autocomplete="new-password" required style="display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-subtle);color:var(--text-primary)"></label>
      <button class="btn-primary" type="submit">Reset password</button>
      <button id="adminForgotPasswordClose" class="btn-ghost" type="button">Close</button>
    </form>
    <div id="adminForgotPasswordMessage" role="status" style="margin-top:12px"></div>
  </dialog>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js?v=20261002-no-admin-polling"></script>
</div>
</body>
</html>
